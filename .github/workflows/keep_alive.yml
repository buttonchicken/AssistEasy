name: Keep Bot Alive

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual run in GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Webhook
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://YOUR-APP-NAME.onrender.com/
